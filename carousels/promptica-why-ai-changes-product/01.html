<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Почему нейросеть меняет продукт — 01</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="slide ">
    <div class="abs" style="left:86px;top:200px;width:908px">
      <div class="fit" data-fit="908" style="text-transform:none;letter-spacing:-0.035em;line-height:.98">Почему нейросеть<br>меняет ваш продукт</div>
      <div class="mrow" style="margin-top:36px"><span><b class="br" style="font-weight:400">[01]</b> исходник</span><span><b class="br" style="font-weight:400">[02]</b> референсы</span><span><b class="br" style="font-weight:400">[03]</b> фон</span><span><b class="br" style="font-weight:400">[04]</b> текст</span></div>
      <div style="font-size:44px;line-height:1.05;margin-top:30px;letter-spacing:-0.02em">4 причины и чек-лист в конце</div>
    </div>
    <div class="ph" style="left:0px;top:690px;width:1080px;height:660px"><div class="hn">фото вылетом: продукт, который нейросеть «изменила»</div><img src="img/01-a.jpg" alt="" onerror="this.remove()"></div>
    <div class="abs mrow" style="left:86px;width:908px;top:640px;font-size:17px"><span>листай →</span><span>до генерации</span></div>
    <div class="hd"><img src="../../assets/logo_black.png" alt="promptica"></div>
    <div class="mt">чек-лист перед генерацией<br>01 / 04</div>
    <svg class="grain"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="1" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  </div>
<script>
Promise.all([document.fonts.load("100px 'HN Black Ext'"), document.fonts.load("20px 'Helios Ext'"), document.fonts.load("20px 'Playfair'"), document.fonts.ready]).then(() => {
  document.querySelectorAll('[data-fit]').forEach(el => { el.style.fontSize = '100px'; el.style.fontSize = (100 * parseFloat(el.dataset.fit) / el.getBoundingClientRect().width) + 'px'; });
});
</script>
