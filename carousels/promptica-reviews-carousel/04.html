<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Отзывы учеников — 04</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-size="1080x1440">
  <div class="slide ">
    <div class="ph" style="left:0;top:170px;width:416px;height:740px"><div class="hn">видео ученика</div><img id="vid" src="img/04-poster.jpg" alt="" style="object-position:50% 40%" onerror="this.remove()"></div>
    <div class="abs lbl br" style="left:470px;top:176px">[03] кейс</div>
    <div class="abs name" style="left:470px;top:216px;width:524px;font-size:40px;line-height:1.05">Генерация<br>видео с ИИ</div>
    <div class="abs" style="left:470px;top:332px;width:524px"><div class="br lbl" style="font-size:17px">[ученик Никита]</div><div class="res" style="margin-top:8px;opacity:.75">пришёл повторять вирусные рилсы</div></div>
    <div class="abs" style="left:470px;top:470px;width:524px"><div style="padding:18px 0;border-top:1px solid rgba(13,13,13,.25)"><div style="font-family:'HN Black Ext',sans-serif;font-size:96px;line-height:.9;letter-spacing:-0.03em">5K</div><div class="lbl" style="margin-top:12px;opacity:.7">подписчиков за два месяца</div></div><div style="padding:18px 0;border-top:1px solid rgba(13,13,13,.25)"><div style="font-family:'HN Black Ext',sans-serif;font-size:96px;line-height:.9;letter-spacing:-0.03em">1</div><div class="lbl" style="margin-top:12px;opacity:.7">первый полноценный заказ</div></div></div>
    <div class="abs" style="left:86px;top:950px;width:908px"><img src="img/04-chat.png" alt="" style="width:704px;display:block"></div>
    <div class="hd"><img src="../../assets/logo_black.png" alt="promptica"></div>
    <div class="mt">отзывы учеников<br>04 / 07</div>
    <script>
    // покадровая подмена кадров видео (для render-video.js); в обычном экспорте остаётся постер
    const FR = '04-frames', N = 361, FPS = 24, vid = document.getElementById('vid');
    window.setT = async function (t) { const k = Math.min(N, Math.floor(t * FPS + 1e-6) + 1); vid.src = 'img/' + FR + '/f' + String(k).padStart(4, '0') + '.jpg'; await vid.decode().catch(() => {}); };
    </script>
    <svg class="grain"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  </div>
<script>
Promise.all([document.fonts.load("100px 'HN Black Ext'"), document.fonts.load("30px 'Playfair'"), document.fonts.load("20px 'Helios Ext'"), document.fonts.ready]).then(() => {
  document.querySelectorAll('[data-fit]').forEach(el => { el.style.fontSize = '100px'; el.style.fontSize = (100 * parseFloat(el.dataset.fit) / el.getBoundingClientRect().width) + 'px'; });
  document.querySelectorAll('[data-box]').forEach(el => { const max = parseFloat(el.dataset.max || 46), h = parseFloat(el.dataset.box); let fs = max; el.style.fontSize = fs + 'px'; while (el.scrollHeight > h && fs > 22) { fs -= 1; el.style.fontSize = fs + 'px'; } });
});
</script>
</body>
</html>
