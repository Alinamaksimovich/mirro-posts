<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>AI SMM-система — 06</title>
  <link rel="stylesheet" href="style.css">
  <style>
    h2 { position: absolute; left: var(--m); top: 250px; font-size: 76px; line-height: 1.05; font-weight: 400; }
    .lines { position: absolute; left: var(--m); width: 760px; top: 560px; }
    .lines p { font-size: 34px; line-height: 1.38; padding: 22px 0; border-top: 1px solid rgba(13,13,13,.2); }
    .lines p:last-child { border-bottom: 1px solid rgba(13,13,13,.2); }

<body>
  <div class="slide bg-white">
    <div class="head"><img src="../../assets/logo_black.png" alt="promptica"><div class="meta">AI SMM-система<br>06 / 07</div></div>
    <h2 class="type">Если пропустить<br>основу, то…</h2>
    <div class="lines">
      <p>каждый пост придётся <b>переделывать</b>;</p>
      <p>бренд будет выглядеть <b>по-разному</b> каждую неделю;</p>

    </div>
    <div class="sticker ph s">стикер</div>
    <svg class="grain" style="opacity:.17"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="6" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
