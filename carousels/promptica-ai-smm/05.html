<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>AI SMM-система — 05</title>
  <link rel="stylesheet" href="style.css">
  <style>
    h2 { position: absolute; left: var(--m); top: 250px; font-size: 76px; line-height: 1.05; font-weight: 400; }
    ol { position: absolute; left: var(--m); right: var(--m); top: 560px; list-style: none; }
    li { display: flex; align-items: baseline; gap: 22px; padding: 22px 0; border-top: 1px solid rgba(13,13,13,.25); font-size: 34px; }
    li:last-child { border-bottom: 1px solid rgba(13,13,13,.25); }
    li:nth-child(even) { padding-left: 300px; }
    li span { font-size: 19px; font-weight: 400; color: var(--red); }
    .s { right: -50px; top: 1000px; width: 400px; height: 400px; transform: rotate(8deg); }
  </style>
</head>
<body>
  <div class="slide bg-cream">
    <div class="head"><img src="../../assets/logo_black.png" alt="promptica"><div class="meta">AI SMM-система<br>05 / 07</div></div>
    <h2 class="type">Что вы получаете<br>в одной системе:</h2>
    <ol>
      <li><span>01</span>единый стиль бренда</li>
      <li><span>02</span>контент-план на месяц</li>
      <li><span>03</span><span class="hl" style="font-size:34px;color:inherit;font-weight:300">уникальный контент</span></li>
      <li><span>04</span>рост охватов</li>
      <li><span>05</span>повышение конверсий</li>
    </ol>
    <div class="sticker ph s">стикер</div>
    <svg class="grain" style="opacity:.18"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="5" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  </div>
</body>
</html>
