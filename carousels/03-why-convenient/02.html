<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Почему удобно — 02</title>
  <link rel="stylesheet" href="../../shared/brand.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .order { background: var(--lime); }
    .outfits { position: absolute; left: 64px; right: 64px; top: 220px; display: flex; gap: 24px; }
    .look { position: relative; flex: 1; height: 400px; border-radius: 22px; overflow: hidden; background: #fff; }
    .look img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; display: block; }
    .look span { position: absolute; left: 14px; bottom: 14px; font-family: var(--font-mono); font-size: 17px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; background: var(--dark); color: var(--cream); padding: 7px 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="half chaos">
      <img src="img/closet-mess.jpg" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 62%;">
      <div style="position:absolute; inset:0; background:linear-gradient(90deg, rgba(44,44,42,.92) 0%, rgba(44,44,42,.55) 48%, rgba(44,44,42,.1) 75%);"></div>
      <div class="lbl" style="left:64px; top:70px; color: var(--lime);">Проблема 01</div>
      <div class="head" style="left:64px; top:120px; width:470px; ">Шкаф полный — надеть нечего</div>
    </div>
    <div class="seam-num">01</div><div class="seam-num low">01</div>
    <div class="half order">
      <div class="lbl" style="left:64px; top:70px;">Решение</div>
      <div class="body" style="left:64px; top:112px; width:600px;">Собирай образы заранее и всегда знай, что носить</div>
      <div class="outfits">
        <div class="look"><img src="img/look-green.jpg" alt=""><span>Вечер</span></div>
        <div class="look"><img src="img/look-red.jpg" alt=""><span>Свидание</span></div>
        <div class="look"><img src="img/look-leather.jpg" alt=""><span>Выходные</span></div>
      </div>
    </div>
    <div class="foot" style="color: var(--dark);"><span>MIRRO®</span><span>02 — 05</span></div>
  </div>
<script src="garments.js"></script>
</body>
</html>
