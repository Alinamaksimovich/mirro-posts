<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Почему удобно — 05</title>
  <link rel="stylesheet" href="../../shared/brand.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .logo { position: absolute; left: 56px; top: 118px; font-family: var(--font-display); font-weight: 900; font-size: 236px; line-height: .9; letter-spacing: -0.04em; }
    .tagline { position: absolute; left: 64px; top: 360px; width: 540px; font-family: var(--font-serif); font-style: italic; font-weight: 500; font-size: 76px; line-height: 1; }
    .steps { position: absolute; left: 64px; top: 640px; width: 480px; list-style: none; }
    .steps li { display: flex; align-items: baseline; gap: 20px; padding: 18px 0; border-top: 2px solid var(--dark); font-size: 29px; font-weight: 700; }
    .steps li:last-child { border-bottom: 2px solid var(--dark); }
    .steps li span { font-family: var(--font-mono); font-size: 20px; font-weight: 700; }
    .cta { position: absolute; left: 64px; top: 1040px; width: 500px; padding: 30px 32px; border-radius: 24px; background: var(--dark); color: var(--cream); }
    .cta .bot { font-family: var(--font-mono); font-size: 28px; font-weight: 700; color: var(--lime); }
    .cta p { margin-top: 12px; font-size: 28px; font-weight: 700; }
    .phone { left: 606px; top: 420px; width: 420px; transform: rotate(4deg); }
  </style>
</head>
<body>
  <div class="slide bg-lime">
    <div class="topbar"><span><i class="dot"></i>MIRRO®</span><span>Попробуй</span><span>05/05</span></div>
    <div class="logo">MIRRO</div>
    <p class="tagline">твой гардероб думает за тебя</p>
    <ul class="steps">
      <li><span>01</span>Всегда знаешь, что надеть</li>
      <li><span>02</span>Все вещи перед глазами</li>
      <li><span>03</span>Без лишних покупок</li>
    </ul>
    <div class="cta"><div class="bot">@Mirro_wardrobe_bot</div><p>ссылка в шапке профиля ↗</p></div>
    <div class="phone"><img src="img/screen-looks.jpg" alt=""></div>
  </div>
</body>
</html>
