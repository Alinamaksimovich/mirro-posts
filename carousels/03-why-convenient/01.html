<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Почему удобно — 01</title>
  <link rel="stylesheet" href="../../shared/brand.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .h1 .display { font-size: 176px; }
    .h1 .serif { font-size: 104px; line-height: .98; margin-top: 8px; }
    .tiles { position: absolute; left: 64px; right: 64px; top: 640px; display: flex; gap: 24px; }
    .tile { flex: 1; height: 500px; border-radius: 28px; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; }
    .tile .n { font-family: var(--font-display); font-weight: 900; font-size: 120px; line-height: .8; }
    .tile .t { font-family: var(--font-mono); font-size: 21px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; line-height: 1.35; }
    .tile .x { align-self: flex-start; font-family: var(--font-mono); font-size: 17px; font-weight: 700; letter-spacing: .08em; padding: 7px 12px; border-radius: 8px; background: var(--dark); color: var(--cream); }
    .tile.d .x { background: var(--lime); color: var(--dark); }
  </style>
</head>
<body>
  <div class="slide bg-cream">
    <div class="topbar"><span><i class="dot"></i>MIRRO®</span><span>Почему удобно</span><span>01/05</span></div>
    <div class="h1">
      <div class="display">Зачем</div>
      <div class="serif italic">тебе цифровой<br>гардероб</div>
    </div>
    <div class="tiles">
      <div class="tile bg-lime"><span class="x">✕ БОЛЬ</span><div><div class="n">01</div><div class="t" style="margin-top:22px">Нечего<br>надеть</div></div></div>
      <div class="tile bg-lavender"><span class="x">✕ БОЛЬ</span><div><div class="n">02</div><div class="t" style="margin-top:22px">Забываю,<br>что есть</div></div></div>
      <div class="tile bg-dark d"><span class="x">✕ БОЛЬ</span><div><div class="n">03</div><div class="t" style="margin-top:22px">Покупаю<br>лишнее</div></div></div>
    </div>
    <div class="plate"><p>3 причины попробовать</p><span class="arrow">ЛИСТАЙ →</span></div>
  </div>
</body>
</html>
