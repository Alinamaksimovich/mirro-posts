<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Почему удобно — 04</title>
  <link rel="stylesheet" href="../../shared/brand.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .order { background: var(--cream); }
    .same { position: absolute; left: 64px; top: 330px; display: flex; gap: 30px; }
    .same .g { position: relative; width: 150px; }
    .row { position: absolute; left: 64px; top: 240px; display: flex; align-items: center; gap: 34px; }
    .row .g { position: relative; }
    .x { position: absolute; inset: -6px; }
    .x::before, .x::after { content: ""; position: absolute; left: 50%; top: 50%; width: 150%; height: 8px; background: var(--dark); border-radius: 4px; }
    .x::before { transform: translate(-50%,-50%) rotate(45deg); } .x::after { transform: translate(-50%,-50%) rotate(-45deg); }
    .slot { position: relative; width: 110px; opacity: .35; }
    .keep { position: relative; width: 150px; padding: 14px; background: var(--lime); border-radius: 20px; }
    .arrow { font-family: var(--font-display); font-weight: 900; font-size: 60px; }
    .outfit { width: 220px; padding: 20px 10px 16px; background: var(--lime); border-radius: 22px; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="half chaos">
      <div class="lbl" style="left:64px; top:70px; color: var(--lime);">Проблема 03</div>
      <div class="head" style="left:64px; top:120px; width:420px;">Покупаешь похожее?</div>
      <div class="same">
        <i class="g" data-g="top" data-c="#5e5e5a" style="--r:-6deg"></i>
        <i class="g" data-g="top" data-c="#5e5e5a" style="--r:3deg"></i>
        <i class="g" data-g="top" data-c="#5e5e5a" style="--r:-2deg"></i>
      </div>
      <div class="lbl" style="left:64px; top:290px; color: rgba(250,248,246,.6);">Чёрный топ × 3</div>
    </div>
    <div class="seam-num">03</div><div class="seam-num low">03</div>
    <div class="half order">
      <div class="lbl" style="left:64px; top:70px;">Решение</div>
      <div class="body" style="left:64px; top:112px; width:600px;">Примеряй до покупки — бери только то, что реально носишь</div>
      <div class="row">
        <div class="slot"><i class="g" data-g="top" data-c="#2C2C2A" style="position:relative"></i><div class="x"></div></div>
        <div class="slot"><i class="g" data-g="top" data-c="#2C2C2A" style="position:relative"></i><div class="x"></div></div>
        <div class="keep"><i class="g" data-g="top" data-c="#2C2C2A" style="position:relative"></i></div>
        <span class="arrow">→</span>
        <div class="outfit"><i class="g" data-g="top" data-c="#2C2C2A" style="width:110px"></i><i class="g" data-g="skirt" data-c="#B9A8F0" style="width:130px; margin-top:-26px"></i><div class="cap">Примерено ✓</div></div>
      </div>
    </div>
    <div class="foot" style="color: var(--dark);"><span>MIRRO®</span><span>04 — 05</span></div>
  </div>
<script src="garments.js"></script>
</body>
</html>
