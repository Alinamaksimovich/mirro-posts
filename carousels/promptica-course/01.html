<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Нейросети с нуля — 01</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="slide ">
    <div class="abs" style="left:86px;top:190px;width:908px"><div class="fit" data-fit="908" style="line-height:.9">Нейросети<br>с нуля</div></div>
    <div class="abs mrow" style="left:86px;top:520px;width:908px"><span>курс promptica</span><span class="br">[что вы получите]</span><span>листай →</span></div>
    <div class="ph" style="left:0px;top:600px;width:1080px;height:750px"><div class="hn">лучшая работа ученика</div><img src="img/01-a.jpg" alt="" style="object-position:50% 45%" onerror="this.remove()"></div>
    <div class="hd"><img src="../../assets/logo_black.png" alt="promptica"></div>
    <div class="mt">курс «нейросети с нуля»<br>01 / 09</div>
    <svg class="grain"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="1" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  </div>
<script>
Promise.all([document.fonts.load("100px 'HN Black Ext'"), document.fonts.load("20px 'Helios Ext'"), document.fonts.ready]).then(() => {
  document.querySelectorAll('[data-fit]').forEach(el => { el.style.fontSize = '100px'; el.style.fontSize = (100 * parseFloat(el.dataset.fit) / el.getBoundingClientRect().width) + 'px'; });
});
</script>
</body>
</html>
