<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Нейросети с нуля — 07</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="slide ">
    <div class="abs" style="left:86px;top:200px;width:908px"><div class="fit" data-fit="420" style="line-height:.9">Гайды</div></div>
    <div class="abs mrow" style="left:86px;top:340px;width:908px"><span class="br">[навсегда]</span><span>остаются у вас после курса</span></div>
    <div class="abs" style="left:86px;top:470px;width:760px;font-size:34px;line-height:1.38">Вы получите гайды, которые заберёте себе навсегда и сможете использовать в работе после окончания курса.</div>
    <div class="abs" style="left:86px;top:800px;width:908px;background:#fff7e6;padding:44px 44px 48px">
      <div class="lbl br">[бонус]</div>
      <div class="name" style="font-size:46px;line-height:1.05;margin-top:18px">Урок по дизайнерскому оформлению постов и рилс</div>
    </div>
    <div class="hd"><img src="../../assets/logo_black.png" alt="promptica"></div>
    <div class="mt">курс «нейросети с нуля»<br>07 / 09</div>
    <svg class="grain"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="7" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  </div>
<script>
Promise.all([document.fonts.load("100px 'HN Black Ext'"), document.fonts.load("20px 'Helios Ext'"), document.fonts.ready]).then(() => {
  document.querySelectorAll('[data-fit]').forEach(el => { el.style.fontSize = '100px'; el.style.fontSize = (100 * parseFloat(el.dataset.fit) / el.getBoundingClientRect().width) + 'px'; });
});
</script>
</body>
