<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Нейросети с нуля — 08</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="slide cream">
    <div class="abs" style="left:86px;top:260px"><div class="thin" data-fit="640" style="line-height:.95">Запись<br>на курс</div></div>
    <div class="abs mrow" style="left:86px;top:640px;width:908px"><span>курс «нейросети с нуля»</span><span>2 месяца</span></div>
    <div class="hair" style="left:86px;top:690px;width:908px"></div>
    <div class="abs it rd" style="left:86px;top:740px;width:800px;font-size:38px;line-height:1.2">[как записаться: слово в комментариях / ссылка в шапке профиля / анкета]</div>
    <div class="hd"><img src="../../assets/logo_black.png" alt="promptica"></div>
    <div class="mt">нейросети с нуля<br>08 / 08</div>
    <svg class="grain"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="8" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  </div>
<script>
Promise.all([document.fonts.load("200 100px 'Vela'"), document.fonts.load("20px 'Helios Ext'"), document.fonts.load("italic 30px 'Playfair'"), document.fonts.ready]).then(() => {
  document.querySelectorAll('[data-fit]').forEach(el => { el.style.fontSize = '100px'; el.style.fontSize = (100 * parseFloat(el.dataset.fit) / el.getBoundingClientRect().width) + 'px'; });
});
</script>
</body>
