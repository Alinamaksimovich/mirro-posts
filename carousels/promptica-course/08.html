<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Нейросети с нуля — 08</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="slide red">
    <div class="abs" style="left:86px;top:240px;width:908px"><div class="fit" data-fit="908" style="line-height:.9;color:#fff7e6">Запись<br>на курс</div></div>
    <div class="abs mrow" style="left:86px;top:560px;width:908px;color:#fff7e6"><span class="br">курс [нейросети с нуля]</span><span>2 месяца</span></div>
    <div class="abs hair" style="left:86px;top:640px;width:908px;color:#fff7e6;opacity:.4"></div>
    <div class="abs" style="left:86px;top:690px;width:780px;font-size:32px;line-height:1.4;color:#fff7e6">[как записаться: слово в комментариях / ссылка в шапке профиля / анкета]</div>
    <div class="hd"><img src="../../assets/logo_cream.png" alt="promptica"></div>
    <div class="mt" style="color:#fff7e6">курс «нейросети с нуля»<br>08 / 08</div>
    <svg class="grain"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="8" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  </div>
<script>
Promise.all([document.fonts.load("100px 'HN Black Ext'"), document.fonts.load("20px 'Helios Ext'"), document.fonts.ready]).then(() => {
  document.querySelectorAll('[data-fit]').forEach(el => { el.style.fontSize = '100px'; el.style.fontSize = (100 * parseFloat(el.dataset.fit) / el.getBoundingClientRect().width) + 'px'; });
});
</script>
</body>
</html>
