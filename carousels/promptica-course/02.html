<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Нейросети с нуля — 02</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="slide ">
    <div class="abs" style="left:0;top:0;width:1080px;height:675px;background:#930400"></div>
    <div class="ph" style="left:0px;top:675px;width:1080px;height:675px"><div class="hn">фото на половину кадра</div><img src="img/02-a.jpg" alt="" style="object-position:50% 45%" onerror="this.remove()"></div>
    <div class="abs" style="left:86px;top:150px"><div class="thin" data-fit="908" style="color:#fff7e6">Видеоуроки</div></div>
    <div class="abs it" style="left:86px;top:330px;width:880px;font-size:48px;line-height:1.1;color:#fff7e6">Смотрите уроки в удобное время и идите в своём темпе.</div>
    <div class="abs" style="left:86px;top:470px;width:760px;font-size:25px;line-height:1.42;color:#fff7e6">Каждый урок разбит на небольшие части, поэтому не нужно выделять на него целый день.</div>
    <div class="abs mrow" style="left:86px;top:615px;width:908px;color:#fff7e6"><span>короткие модули</span><span>своё расписание</span><span>в удобное время</span></div>
    <div class="hd"><img src="../../assets/logo_cream.png" alt="promptica"></div>
    <div class="mt" style="color:#fff7e6">нейросети с нуля<br>02 / 07</div>
    <svg class="grain"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  </div>
<script>
Promise.all([document.fonts.load("200 100px 'Vela'"), document.fonts.load("20px 'Helios Ext'"), document.fonts.load("italic 30px 'Playfair'"), document.fonts.ready]).then(() => {
  document.querySelectorAll('[data-fit]').forEach(el => { el.style.fontSize = '100px'; el.style.fontSize = (100 * parseFloat(el.dataset.fit) / el.getBoundingClientRect().width) + 'px'; });
  const ctx = document.createElement('canvas').getContext('2d');
  document.querySelectorAll('[data-fit],.thin,.light').forEach(el => { if (el.dataset.opt === '0') return; const cs = getComputedStyle(el); ctx.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily; const m = ctx.measureText((el.textContent.trim()[0] || 'A')); el.style.marginLeft = m.actualBoundingBoxLeft + 'px'; });
});
</script>
</body>
</html>
