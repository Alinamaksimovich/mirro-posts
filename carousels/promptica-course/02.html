<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Нейросети с нуля — 02</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="slide cream">
    <div class="abs" style="left:86px;top:170px"><div class="thin" data-fit="908" style="">Видеоуроки</div></div>
    <div class="abs it" style="left:86px;top:480px;width:850px;font-size:60px;line-height:1.1">Смотрите уроки в удобное время и идите в своём темпе.</div>
    <div class="abs" style="left:86px;top:760px;width:640px;font-size:30px;line-height:1.42">Каждый урок разбит на небольшие части, поэтому не нужно выделять на него целый день.</div>
    <div class="abs mrow" style="left:86px;top:1250px;width:908px"><span>короткие модули</span><span>своё расписание</span><span class="rd">в удобное время</span></div>
    <div class="hd"><img src="../../assets/logo_black.png" alt="promptica"></div>
    <div class="mt">нейросети с нуля<br>02 / 08</div>
    <svg class="grain"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  </div>
<script>
Promise.all([document.fonts.load("200 100px 'Vela'"), document.fonts.load("20px 'Helios Ext'"), document.fonts.load("italic 30px 'Playfair'"), document.fonts.ready]).then(() => {
  document.querySelectorAll('[data-fit]').forEach(el => { el.style.fontSize = '100px'; el.style.fontSize = (100 * parseFloat(el.dataset.fit) / el.getBoundingClientRect().width) + 'px'; });
});
</script>
</body>
</html>
