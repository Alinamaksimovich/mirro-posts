<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Нейросети с нуля — 04</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="slide ">
    <div class="ph" style="left:0px;top:0px;width:1080px;height:1350px;background:#2a0000"><div class="hn">фото на весь слайд</div><img src="img/04-a.jpg" alt="" style="object-position:50% 50%" onerror="this.remove()"></div>
    <div class="abs" style="left:240px;top:250px;width:600px;height:860px;background:#fff7e6;border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.3)">
      <div style="text-align:center;padding-top:46px"><img src="../../assets/logo_black.png" alt="promptica" style="height:26px"></div>
      <div style="position:absolute;left:0;right:0;top:230px;text-align:center">
        <div class="thin" style="font-size:104px">2 месяца</div>
        <div class="it" style="font-size:38px;margin-top:12px">с обратной связью</div>
      </div>
      <div style="position:absolute;left:0;right:0;bottom:48px;padding:0 20px;text-align:center;font-size:20px;line-height:1.6;white-space:nowrap">
        <div style="font-size:17px;letter-spacing:.03em;color:#930400;margin-bottom:12px">что входит</div><div>разбор работ участников на курсе</div><div>сборка портфолио</div><div>проверка домашних заданий с комментариями</div><div>ответы кураторов на вопросы по ходу курса</div><div>закрытый чат участников</div>
      </div>
    </div>
    <div class="hd"><img src="../../assets/logo_cream.png" alt="promptica"></div>
    <div class="mt" style="color:#fff7e6">нейросети с нуля<br>04 / 07</div>
    <svg class="grain"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  </div>
<script>
Promise.all([document.fonts.load("200 100px 'Vela'"), document.fonts.load("20px 'Helios Ext'"), document.fonts.load("italic 30px 'Playfair'"), document.fonts.ready]).then(() => {
  document.querySelectorAll('[data-fit]').forEach(el => { el.style.fontSize = '100px'; el.style.fontSize = (100 * parseFloat(el.dataset.fit) / el.getBoundingClientRect().width) + 'px'; });
});
</script>
</body>
</html>
