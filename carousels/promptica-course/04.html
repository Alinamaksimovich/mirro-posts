<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Нейросети с нуля — 04</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="slide ">
    <div class="abs" style="left:86px;top:200px;width:908px"><div class="fit" data-fit="650" style="line-height:.9">2 месяца</div></div>
    <div class="abs mrow" style="left:86px;top:340px;width:908px"><span class="br">[срок курса]</span><span>с обратной связью</span></div>
    <div class="abs lbl br" style="left:86px;top:470px">[что входит]</div>
    <div class="abs" style="left:86px;top:510px;width:908px"><div class="row" style="padding:30px 0;font-size:34px"><i class="cb" style="display:inline-block;margin-right:22px;vertical-align:middle"></i><span class="t">разбор работ участников на курсе</span></div><div class="row" style="padding:30px 0;font-size:34px"><i class="cb" style="display:inline-block;margin-right:22px;vertical-align:middle"></i><span class="t">сборка портфолио</span></div><div class="row" style="padding:30px 0;font-size:34px"><i class="cb" style="display:inline-block;margin-right:22px;vertical-align:middle"></i><span class="t">проверка домашних заданий с комментариями</span></div><div class="row" style="padding:30px 0;font-size:34px"><i class="cb" style="display:inline-block;margin-right:22px;vertical-align:middle"></i><span class="t">ответы кураторов на вопросы по ходу курса</span></div><div class="row" style="padding:30px 0;font-size:34px"><i class="cb" style="display:inline-block;margin-right:22px;vertical-align:middle"></i><span class="t">закрытый чат участников</span></div></div>
    <div class="hd"><img src="../../assets/logo_black.png" alt="promptica"></div>
    <div class="mt">курс «нейросети с нуля»<br>04 / 08</div>
    <svg class="grain"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  </div>
<script>
Promise.all([document.fonts.load("100px 'HN Black Ext'"), document.fonts.load("20px 'Helios Ext'"), document.fonts.ready]).then(() => {
  document.querySelectorAll('[data-fit]').forEach(el => { el.style.fontSize = '100px'; el.style.fontSize = (100 * parseFloat(el.dataset.fit) / el.getBoundingClientRect().width) + 'px'; });
});
</script>
</body>
</html>
