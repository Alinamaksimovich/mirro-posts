<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Слишком AI — 04</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .title { position: absolute; left: var(--m); top: 400px; font-size: 76px; }

    .title { left: 0; right: 0; text-align: center; }
    .off { display: inline-block; color: var(--red); transform: translate(10px, 14px) rotate(14deg); }
    .guide { position: absolute; background: var(--red); opacity: .45; }
    .tick { position: absolute; font-size: 15px; letter-spacing: .1em; color: var(--red); opacity: .8; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="head"><img src="../../assets/logo_black.png" alt="promptica"><div class="meta">Слишком AI<br>04 / 06</div></div>
    <div class="num">03</div>
    <div class="guide" style="left: 539px; top: 360px; width: 1px; height: 330px;"></div>
    <div class="guide" style="left: 86px; right: 86px; top: 398px; height: 1px;"></div>
    <div class="guide" style="left: 86px; right: 86px; top: 552px; height: 1px;"></div>
    <div class="tick" style="left: 548px; top: 362px;">50%</div>
    <div class="h title">Идеальная<br>симметри<span class="off">я</span></div>
    <div class="blocks">
      <div class="blk"><div class="lbl">Ошибка</div><p class="txt">композиция выверена по линейке.</p></div>
      <div class="blk"><div class="lbl">Направление</div><p class="txt">в жизни так не бывает. Добавьте немного хаоса.</p></div>
    </div>

    <svg class="grain"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  </div>
</body>
</html>
