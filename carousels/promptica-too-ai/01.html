<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Слишком AI — 01</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .hook { position: absolute; left: var(--m); top: 420px; font-size: 74px; white-space: nowrap; z-index: 2; }
    .sub { z-index: 2; }
    /* видео-подложка: положить файл в img/01-bg.mp4 — пока его нет, видна схема */
    .bgvideo { position: absolute; inset: 0; z-index: 0; background: rgba(13,13,13,.06); }
    .bgvideo video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .bgvideo .hint { position: absolute; left: 0; right: 0; bottom: 330px; text-align: center; font-size: 17px; letter-spacing: .12em; text-transform: uppercase; color: rgba(13,13,13,.4); }
    .sub { position: absolute; left: var(--m); top: 620px; width: 700px; font-size: 38px; line-height: 1.3; }
    .swipe { position: absolute; right: var(--m); bottom: 70px; font-size: 19px; z-index: 5; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="head"><img src="../../assets/logo_black.png" alt="promptica"><div class="meta">Слишком AI<br>01 / 06</div></div>
    <div class="bgvideo"><div class="hint">здесь будет видео-подложка</div><video src="img/01-bg.mp4" muted loop autoplay playsinline onerror="this.remove()"></video></div>
    <div class="h hook">Почему это<br>«слишком AI»</div>
    <p class="sub">4 признака, которые выдают нейросеть</p>
    <div class="swipe">листай →</div>
    <div class="note">проверь свой контент →</div>
    <svg class="grain"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="1" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  </div>
</body>
</html>
