<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Слишком AI — 01 (видео)</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Слайд 1 — MP4. Подложка: нарезка из 4 кадров (img/01-frames, 14 кадров × 24 fps = 0,583 с),
       повторяется 10 раз = 5,833 с. Склейка «конец → начало» такая же, как все остальные, поэтому цикл бесшовный.
       Рендер: node scripts/render-video.js carousels/promptica-too-ai/01.html output/promptica-too-ai/01.mp4 5.833333 30
       Версия из «плохих» генераций (ваша нарезка): node scripts/render-video.js "carousels/promptica-too-ai/01.html?set=bad" output/promptica-too-ai/01-bad.mp4 6.083333 24 */
    .slide { background: var(--black); }
    .frames img { position: absolute; left: 0; top: 0; width: 1080px; height: 1440px; display: none; z-index: 0; }

    /* затемнение: верх и низ, чтобы колонтитул и текст читались на любом кадре */
    .scrim { position: absolute; inset: 0; z-index: 1;
      background:
        linear-gradient(180deg, rgba(13,13,13,.55) 0%, rgba(13,13,13,0) 22%),
        linear-gradient(0deg, rgba(13,13,13,.86) 0%, rgba(13,13,13,.62) 34%, rgba(13,13,13,0) 62%); }

    .head { color: var(--cream); z-index: 5; }
    .hook { position: absolute; left: var(--m); bottom: 300px; font-size: 76px; white-space: nowrap; color: var(--cream); z-index: 5; }
    .sub { position: absolute; left: var(--m); bottom: 208px; width: 760px; font-size: 36px; line-height: 1.3; color: var(--cream); z-index: 5; }
    .swipe { position: absolute; right: var(--m); bottom: 70px; font-size: 19px; color: var(--cream); z-index: 5; }
    .note { color: var(--cream); }
  </style>
</head>
<body>
  <div class="slide">
    <div class="frames" id="frames"></div>
    <div class="scrim"></div>
    <div class="head"><img src="../../assets/logo_cream.png" alt="promptica"><div class="meta">Слишком AI<br>01 / 06</div></div>
    <div class="h hook">Почему это<br>«слишком AI»</div>
    <p class="sub">4 признака, которые выдают нейросеть</p>
    <div class="note">проверь свой контент →</div>
    <div class="swipe">листай →</div>
    <svg class="grain" style="opacity:.16"><filter id="g"><feTurbulence id="turb" type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="1" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  </div>
<script>
  // Два набора подложки. По умолчанию — нарезка «ок» (14 кадров). ?set=bad — ваша нарезка из «плохих» генераций (73 кадра, 16 планов).
  const BAD = new URLSearchParams(location.search).get('set') === 'bad';
  const LENS = BAD ? [6,4,5,4,4,5,4,4,5,4,5,4,6,4,4,5] : [4,3,4,3];   // длительность каждого плана в кадрах (24 fps)
  const MAP = []; LENS.forEach((n, k) => { for (let i = 0; i < n; i++) MAP.push(k % 4); }); // какое из 4 фото на каком кадре
  const N = MAP.length, SRC_FPS = 24, LOOP = N / SRC_FPS;            // «ок»: 0,583 с, «плохие»: 3,042 с
  const box = document.getElementById('frames'), turb = document.getElementById('turb');
  const imgs = [];
  const four = [1, 2, 3, 4].map(n => {
    const im = document.createElement('img');
    im.src = (BAD ? 'img/01-frames-bad/p' : 'img/01-frames-good/p') + n + '.jpg';
    box.appendChild(im); return im;
  });
  for (let i = 0; i < N; i++) imgs.push(four[MAP[i]]);
  let cur = -1;
  // t — секунды; frame — номер кадра ролика (для «живого» зерна)
  window.setT = function (t, frame = 0) {
    const idx = Math.min(N - 1, Math.floor(((t % LOOP) + 1e-6) * SRC_FPS));
    if (idx !== cur) { if (cur >= 0) imgs[cur].style.display = 'none'; imgs[idx].style.display = 'block'; cur = idx; }
    turb.setAttribute('seed', String((frame % 8) + 1));
  };
  Promise.all([document.fonts.ready, ...imgs.map(i => i.decode().catch(() => {}))]).then(() => window.setT(0));
</script>
</body>
</html>
