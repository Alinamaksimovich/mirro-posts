<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вопрос 01</title>
  <link rel="stylesheet" href="../../shared/brand.css">
  <link rel="stylesheet" href="stories.css">
  <style>
    .story { background: var(--lime); }
    .qmark { color: rgba(44,44,42,.08); }
    .q .serif { font-size: 120px; }
    .q .display { font-size: 190px; letter-spacing: -0.03em; }
    .answer { top: 690px; }
    .phone { left: 520px; top: 1000px; width: 470px; transform: rotate(5deg); }
    .steps { position: absolute; left: 72px; top: 1080px; display: flex; flex-direction: column; gap: 22px; z-index: 3; }
    .steps .chip { position: static; font-size: 24px; padding: 16px 22px; }
    .steps .arrow { font-family: var(--font-display); font-weight: 900; font-size: 40px; padding-left: 30px; line-height: 1; }
  </style>
</head>
<body data-size="1080x1920">
  <div class="story">
    <div class="qmark">?</div>
    <div class="label"><span><i class="dot" style="background: var(--dark)"></i>MIRRO®</span><span>Вопросы · 01/05</span></div>
    <div class="q">
      <div class="serif italic">что такое</div>
      <div class="display">MIRRO?</div>
    </div>
    <p class="answer">MIRRO — твой цифровой гардероб с примеркой. Фотографируешь свою одежду, создаёшь цифрового аватара и примеряешь образы на себе — ещё до того, как наденешь.</p>
    <div class="steps">
      <span class="chip">01 · Фото вещей</span>
      <span class="arrow">↓</span>
      <span class="chip">02 · Твой аватар</span>
      <span class="arrow">↓</span>
      <span class="chip">03 · Примерка</span>
    </div>
    <div class="phone"><img src="../01-how-it-works/img/screen-wardrobe.jpg" alt=""></div>
  </div>
</body>
</html>
