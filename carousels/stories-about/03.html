<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>О MIRRO — 03</title>
  <link rel="stylesheet" href="../../shared/brand.css">
  <link rel="stylesheet" href="../stories-faq/stories.css">
  <style>
    .story { background: var(--lime); }
    .q .display { font-size: 200px; letter-spacing: -0.03em; }
    .q .serif { font-size: 150px; margin-top: -6px; }
    .steps { position: absolute; left: 72px; right: 72px; top: 720px; z-index: 3; }
    .step { display: flex; align-items: center; gap: 30px; padding: 22px 0; border-top: 3px solid var(--dark); }
    .step:last-child { border-bottom: 3px solid var(--dark); }
    .step .n { font-family: var(--font-display); font-weight: 900; font-size: 70px; width: 120px; }
    .step p { flex: 1; font-size: 44px; font-weight: 700; line-height: 1.15; }
    .step .th { width: 130px; height: 130px; border-radius: 22px; overflow: hidden; background: var(--cream); display: flex; align-items: center; justify-content: center; }
    .step .th img { max-width: 88%; max-height: 88%; object-fit: contain; }
    .step .th img.cover { width: 100%; height: 100%; max-width: none; max-height: none; object-fit: cover; object-position: 50% 15%; }
    .cta { position: absolute; left: 72px; right: 72px; top: 1330px; padding: 40px 48px; border-radius: 36px; background: var(--dark); color: var(--cream); z-index: 3; display: flex; align-items: center; justify-content: space-between; }
    .cta p { font-size: 46px; font-weight: 700; }
    .cta .bot { margin-top: 12px; font-family: var(--font-mono); font-size: 28px; font-weight: 700; color: var(--lime); }
    .cta .up { font-family: var(--font-display); font-weight: 900; font-size: 110px; color: var(--lime); line-height: 1; }
  </style>
</head>
<body data-size="1080x1920">
  <div class="story">
    <div class="label"><span><i class="dot" style="background: var(--dark)"></i>MIRRO®</span><span>О MIRRO · 03/03</span></div>
    <div class="q">
      <div class="display">Как</div>
      <div class="serif italic">начать</div>
    </div>
    <div class="steps">
      <div class="step"><span class="n">01</span><p>Добавь свои вещи</p><div class="th"><img src="../03-why-convenient/img/item-top-green.png" alt=""></div></div>
      <div class="step"><span class="n">02</span><p>Создай аватара из селфи</p><div class="th"><img class="cover" src="../01-how-it-works/img/selfie.jpg" alt=""></div></div>
      <div class="step"><span class="n">03</span><p>Примеряй и сохраняй образы</p><div class="th"><img class="cover" src="../03-why-convenient/img/look-red.jpg" alt=""></div></div>
    </div>
    <div class="cta">
      <div><p>Попробуй → ссылка в шапке</p><div class="bot">@Mirro_wardrobe_bot</div></div>
      <div class="up">↑</div>
    </div>
  </div>
</body>
</html>
