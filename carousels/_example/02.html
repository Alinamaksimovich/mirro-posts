<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Пример — слайд 2</title>
  <link rel="stylesheet" href="../../shared/brand.css">
  <style>
    .slide { display: grid; grid-template-rows: auto 1fr; gap: 48px; }
    .swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .sw { border-radius: 32px; padding: 36px; display: flex; flex-direction: column; justify-content: flex-end; font-size: 28px; font-weight: 700; }
    .sw.cream { border: 2px solid var(--cream); }
  </style>
</head>
<body>
  <div class="slide bg-dark">
    <h2 class="serif" style="font-size: 96px;">Цвета <span class="italic">бренда</span></h2>
    <div class="swatches">
      <div class="sw bg-lime" style="color: var(--dark)">Лайм<br>#D8F27F</div>
      <div class="sw bg-lavender" style="color: var(--dark)">Лаванда<br>#B9A8F0</div>
      <div class="sw bg-cream" style="color: var(--dark)">Крем<br>#FAF8F6</div>
      <div class="sw cream" style="color: var(--cream)">Тёмный<br>#2C2C2A</div>
    </div>
  </div>
</body>
</html>
