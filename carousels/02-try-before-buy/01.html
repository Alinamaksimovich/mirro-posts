<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Примерь перед шопингом — 01</title>
  <link rel="stylesheet" href="../../shared/brand.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .h1 .display { font-size: 168px; }
    .h1 .serif { font-size: 150px; margin-top: 0; }
    .items .card { box-shadow: 0 30px 60px rgba(44,44,42,.14); background: #fff; }
    .i1 { left: 64px;  top: 640px; width: 290px; height: 387px; transform: rotate(-4deg); }
    .i2 { left: 392px; top: 600px; width: 290px; height: 410px; transform: rotate(2deg); }
    .i3 { left: 718px; top: 650px; width: 300px; height: 308px; transform: rotate(-2deg); }
    .group-frame { left: 40px; top: 572px; width: 1000px; height: 500px; }
  </style>
</head>
<body>
  <div class="slide bg-cream">
    <div class="topbar"><span><i class="dot"></i>MIRRO®</span><span>Перед покупкой</span><span>01/05</span></div>

    <div class="h1">
      <div class="display">Хватит</div>
      <div class="serif italic">покупать зря</div>
    </div>
    <p class="sub" style="top: 470px;">примеряй до того, как купишь</p>

    <div class="frame group-frame dark"><i></i></div>
    <div class="items">
      <div class="card i1"><img src="img/item-top.jpg" alt=""></div>
      <div class="card i2"><img src="img/item-trousers.jpg" alt=""></div>
      <div class="card i3"><img src="img/item-sweater.jpg" alt=""></div>
    </div>
    <span class="chip" style="left: 84px; top: 1004px; transform: rotate(-4deg);">✕ Висит с биркой</span>
    <span class="chip" style="left: 420px; top: 990px; transform: rotate(2deg);">✕ Не к чему надеть</span>
    <span class="chip lime" style="left: 760px; top: 940px; transform: rotate(-2deg);">✓ Ношу</span>

    <div class="plate" style="right: 64px; top: 1200px;">Листай →</div>
    <p class="serif italic" style="position:absolute; left:64px; top:1206px; font-size:52px;">знакомо?</p>
  </div>
</body>
</html>
