<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Примерь перед шопингом — 02</title>
  <link rel="stylesheet" href="../../shared/brand.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .h1 .display { font-size: 112px; }
    .h1 .serif { font-size: 108px; }
    .photo { left: 560px; top: 420px; width: 456px; height: 830px; }
    .photo img { object-position: 50% 30%; }
    .photo-frame { left: 536px; top: 396px; width: 504px; height: 878px; }
    .tag { position: absolute; left: 470px; top: 600px; z-index: 6; transform: rotate(-8deg); display: flex; align-items: center; gap: 14px; padding: 18px 30px 18px 22px; background: var(--lime); border-radius: 12px 40px 40px 12px; font-family: var(--font-display); font-weight: 900; font-size: 46px; box-shadow: 0 20px 40px rgba(44,44,42,.2); }
    .tag::before { content: ""; width: 18px; height: 18px; border-radius: 50%; background: var(--lavender); box-shadow: inset 0 0 0 3px var(--dark); }
    .actions { position: absolute; left: 64px; top: 760px; display: flex; flex-direction: column; gap: 18px; }
    .act { display: flex; align-items: center; gap: 18px; width: 450px; padding: 24px 24px; border-radius: 22px; background: var(--cream); font-size: 27px; white-space: nowrap; font-weight: 700; }
    .act .ic { width: 54px; height: 54px; border-radius: 50%; background: var(--dark); color: var(--lime); display: flex; align-items: center; justify-content: center; font-size: 28px; flex: none; }
    .or { font-family: var(--font-serif); font-style: italic; font-size: 44px; padding-left: 26px; }
  </style>
</head>
<body>
  <div class="slide bg-lavender">
    <div class="topbar"><span><i class="dot"></i>MIRRO®</span><span>Шаг 01 · Нашла вещь</span><span>02/05</span></div>

    <div class="h1">
      <div class="display">Увидела</div>
      <div class="row"><span class="display">вещь</span><span class="serif italic">в магазине?</span></div>
    </div>
    <p class="sub" style="top: 430px; width: 440px;">Сфоткай её или сохрани фото</p>

    <div class="actions">
      <div class="act"><span class="ic">◎</span>Сфоткать в примерочной</div>
      <div class="or">или</div>
      <div class="act"><span class="ic">↓</span>Сохранить фото с сайта</div>
    </div>

    <div class="card photo"><img src="../01-how-it-works/img/photo-mirror.jpg" alt=""></div>
    <div class="frame photo-frame dark"><i></i></div>
    <div class="tag">ХОЧУ</div>
    <span class="chip" style="left: 584px; top: 1196px;">Фото · примерочная</span>
  </div>
</body>
</html>
