<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Продуктовый кадр — 06</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="slide ">
    <div class="photo"><div class="hint">сюда — кадр «после»: апскейл</div><img src="img/06-after.jpg" alt="" onerror="this.remove()"></div>
    <div class="scrim"></div>
    <div class="steps"><span class="">01</span><span class="">02</span><span class="">03</span><span class="">04</span><span class="on">05</span></div>
    <div class="vname">TOPAZ</div>
    <div class="before"><div class="in"><div class="hint">фото «до»:<br>низкое разрешение</div><img src="img/06-before.jpg" alt="" onerror="this.remove()"></div><div class="cap">до</div></div>
    <div class="copy"><div class="kick">апскейл</div>
      <div class="row"><div class="l">зачем</div><div class="t">поднять разрешение и чёткость.</div></div>
      <div class="row"><div class="l">что получаем</div><div class="t">кадр для карточки маркетплейса и печати.</div></div></div>
    <div class="note">последний штрих</div>
    <div class="head"><img src="../../assets/logo_cream.png" alt="promptica"><div class="meta">продуктовый кадр<br>06 / 07</div></div>
    <svg class="grain"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="6" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  </div>
<script>
  const v = document.querySelector('.vname');
  document.fonts.ready.then(() => { let fs = 190; v.style.fontSize = fs + 'px'; while (v.scrollHeight > 1040 && fs > 40) { fs -= 4; v.style.fontSize = fs + 'px'; } });
</script>
</body>
</html>
