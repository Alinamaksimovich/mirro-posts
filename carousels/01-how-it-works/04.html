<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Как работает MIRRO — 04</title>
  <link rel="stylesheet" href="../../shared/brand.css">
  <style>
    .h1 { position: absolute; left: 64px; top: 128px; }
    .h1 .display { font-size: 112px; }
    .h1 .serif { font-size: 108px; margin-top: 2px; }
    .sub { position: absolute; left: 64px; top: 404px; width: 820px; font-size: 32px; font-weight: 500; line-height: 1.35; }

    .folders { position: absolute; left: 64px; right: 64px; top: 530px; display: flex; gap: 24px; }
    .folder { width: 300px; }
    .folder .tab { display: inline-flex; align-items: center; height: 56px; padding: 0 24px; border-radius: 18px 18px 0 0; font-family: var(--font-mono); font-size: 19px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .folder .body { height: 600px; padding: 20px; border-radius: 0 24px 24px 24px; }
    .folder .pic { height: 100%; border-radius: 16px; overflow: hidden; background: #F7F7F7; }
    .folder .pic img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; display: block; }
    .f1 .tab, .f1 .body { background: var(--lavender); }
    .f2 .tab, .f2 .body { background: var(--lime); }
    .f3 .tab, .f3 .body { background: var(--dark); color: var(--cream); }

    .new { position: absolute; left: 64px; top: 1220px; display: flex; align-items: center; gap: 14px; padding: 16px 26px; border: 2px dashed var(--dark); border-radius: 40px; font-family: var(--font-mono); font-size: 20px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .note { position: absolute; right: 64px; top: 1236px; font-family: var(--font-serif); font-style: italic; font-size: 40px; }
  </style>
</head>
<body>
  <div class="slide bg-cream">
    <div class="topbar"><span><i class="dot"></i>MIRRO®</span><span>Шаг 04 · Образы</span><span>04/05</span></div>

    <div class="h1">
      <div class="display">Планируй</div>
      <div class="serif italic">гардероб заранее</div>
    </div>
    <p class="sub">Сохраняй образы в папки — под поездку, сезон или вишлист</p>

    <div class="folders">
      <div class="folder f1"><div class="tab">В отпуск</div><div class="body"><div class="pic"><img src="img/look-black-dress.jpg" alt=""></div></div></div>
      <div class="folder f2"><div class="tab">Хочу</div><div class="body"><div class="pic"><img src="img/look-red-dress.jpg" alt=""></div></div></div>
      <div class="folder f3"><div class="tab">Осень 2026</div><div class="body"><div class="pic"><img src="img/look-leather.jpg" alt=""></div></div></div>
    </div>

    <div class="new">+ Новая папка</div>
    <div class="note">сколько угодно папок</div>
  </div>
</body>
</html>
