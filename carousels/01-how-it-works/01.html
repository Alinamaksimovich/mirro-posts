<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Как работает MIRRO — 01</title>
  <link rel="stylesheet" href="../../shared/brand.css">
  <style>
    .h1 { position: absolute; left: 64px; top: 128px; }
    .h1 .display { font-size: 92px; white-space: nowrap; }
    .h1 .serif { font-size: 124px; margin-top: 6px; }

    .photo { left: 64px; top: 450px; width: 470px; height: 700px; }
    .photo img { object-position: 50% 35%; }
    .photo-frame { left: 40px; top: 426px; width: 518px; height: 748px; }
    .scan { position: absolute; left: 40px; top: 760px; width: 560px; height: 4px; background: var(--lime); box-shadow: 0 0 18px 4px rgba(216,242,127,.8); }
    .chip { position: absolute; font-family: var(--font-mono); font-size: 18px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 8px 14px; border-radius: 8px; background: var(--dark); color: var(--cream); }

    .ai { position: absolute; left: 566px; top: 712px; width: 100px; height: 100px; border-radius: 50%; background: var(--dark); color: var(--lime); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 900; font-size: 30px; z-index: 3; }

    .item-head { position: absolute; left: 640px; top: 452px; }
    .item { left: 640px; top: 500px; width: 376px; height: 520px; background: #fff; box-shadow: 0 30px 60px rgba(44,44,42,.12); }
    .item-name { position: absolute; left: 640px; top: 1044px; }
    .item-name b { display: block; font-size: 32px; font-weight: 700; }
    .item-name span { font-size: 24px; color: #8a8a86; }
    .tags { position: absolute; left: 640px; top: 1124px; display: flex; gap: 10px; }
    .tags .chip { position: static; display: flex; align-items: center; gap: 8px; }
    .tags .chip::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--lime); }

    .plate { position: absolute; left: 64px; right: 64px; top: 1196px; height: 100px; border-radius: 20px; background: var(--lime); display: flex; align-items: center; padding: 0 32px; gap: 26px; }
    .plate .num { font-family: var(--font-display); font-weight: 900; font-size: 48px; }
    .plate p { font-size: 30px; font-weight: 700; flex: 1; white-space: nowrap; }
    .plate .arrow { font-family: var(--font-mono); font-size: 20px; font-weight: 700; letter-spacing: .1em; }
  </style>
</head>
<body>
  <div class="slide bg-cream">
    <div class="topbar"><span><i class="dot"></i>MIRRO®</span><span>Как это работает</span><span>01/05</span></div>

    <div class="h1">
      <div class="display">Весь гардероб</div>
      <div class="serif italic">в телефоне</div>
    </div>

    <div class="card photo"><img src="img/photo-mirror.jpg" alt=""></div>
    <div class="frame photo-frame"><i></i></div>
    <div class="scan"></div>
    <div class="chip" style="left: 84px; top: 470px;">Фото</div>

    <div class="ai">AI</div>

    <div class="mono item-head">→ Добавлено в гардероб</div>
    <div class="card item"><img src="img/item-red-dress.jpg" alt="" style="object-fit: contain;"></div>
    <div class="item-name"><b>Платье в пол</b><span>Платья</span></div>
    <div class="tags"><span class="chip">Платья</span><span class="chip">Красный</span></div>

    <div class="plate">
      <span class="num">01</span>
      <p>Сфоткай вещь — AI добавит её в гардероб</p>
      <span class="arrow">ЛИСТАЙ →</span>
    </div>
  </div>
</body>
</html>
