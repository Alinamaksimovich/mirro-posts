<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Как работает MIRRO — 05</title>
  <link rel="stylesheet" href="../../shared/brand.css">
  <style>
    .logo { position: absolute; left: 56px; top: 118px; font-family: var(--font-display); font-weight: 900; font-size: 236px; line-height: .9; letter-spacing: -0.04em; }
    .tagline { position: absolute; left: 64px; top: 360px; width: 520px; font-family: var(--font-serif); font-style: italic; font-weight: 500; font-size: 76px; line-height: 1; }

    .steps { position: absolute; left: 64px; top: 590px; width: 480px; list-style: none; }
    .steps li { display: flex; align-items: baseline; gap: 20px; padding: 18px 0; border-top: 2px solid var(--dark); font-size: 30px; font-weight: 700; }
    .steps li:last-child { border-bottom: 2px solid var(--dark); }
    .steps li span { font-family: var(--font-mono); font-size: 20px; font-weight: 700; }

    .cta { position: absolute; left: 64px; top: 1040px; width: 500px; padding: 30px 32px; border-radius: 24px; background: var(--dark); color: var(--cream); }
    .cta p { font-size: 30px; font-weight: 700; line-height: 1.3; }
    .cta .bot { margin-top: 16px; font-family: var(--font-mono); font-size: 24px; font-weight: 700; color: var(--lime); letter-spacing: .02em; }

    .phone { position: absolute; left: 606px; top: 420px; width: 420px; padding: 14px; border-radius: 60px; background: var(--dark); transform: rotate(4deg); box-shadow: 0 40px 80px rgba(44,44,42,.3); }
    .phone img { display: block; width: 100%; border-radius: 46px; }
  </style>
</head>
<body>
  <div class="slide bg-lime">
    <div class="topbar"><span><i class="dot"></i>MIRRO®</span><span>Попробуй</span><span>05/05</span></div>

    <div class="logo">MIRRO</div>
    <p class="tagline">твой гардероб всегда под рукой</p>

    <ul class="steps">
      <li><span>01</span>Сфоткай вещь</li>
      <li><span>02</span>Создай аватара</li>
      <li><span>03</span>Примеряй образы</li>
      <li><span>04</span>Планируй гардероб</li>
    </ul>

    <div class="cta">
      <p>Ссылка на приложение<br>в шапке профиля ↗</p>
      <div class="bot">@Mirro_wardrobe_bot</div>
    </div>

    <div class="phone"><img src="img/screen-wardrobe.jpg" alt=""></div>
  </div>
</body>
</html>
