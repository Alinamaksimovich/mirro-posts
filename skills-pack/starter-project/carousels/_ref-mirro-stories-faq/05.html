<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вопрос 05</title>
  <link rel="stylesheet" href="../../shared/brand.css">
  <link rel="stylesheet" href="stories.css">
  <style>
    .story { background: var(--lime); }
    .qmark { color: rgba(44,44,42,.08); }
    .q .display { font-size: 250px; letter-spacing: -0.04em; }
    .q .serif { font-size: 150px; margin-top: -10px; }
    .answer { top: 720px; }
    .cta { position: absolute; left: 72px; right: 72px; top: 1060px; padding: 56px 56px 60px; border-radius: 40px; background: var(--dark); color: var(--cream); z-index: 3; }
    .cta .up { font-family: var(--font-display); font-weight: 900; font-size: 120px; line-height: 1; color: var(--lime); }
    .cta p { margin-top: 30px; font-size: 46px; font-weight: 700; line-height: 1.25; }
    .cta .bot { margin-top: 30px; font-family: var(--font-mono); font-size: 34px; font-weight: 700; color: var(--lime); }
    .tg { position: absolute; left: 72px; top: 1560px; z-index: 3; display: flex; gap: 14px; }
    .tg .chip { position: static; }
  </style>
</head>
<body data-size="1080x1920">
  <div class="story">
    <div class="qmark">?</div>
    <div class="label"><span><i class="dot" style="background: var(--dark)"></i>MIRRO®</span><span>Вопросы · 05/05</span></div>
    <div class="q">
      <div class="display">Где</div>
      <div class="serif italic">скачать?</div>
    </div>
    <p class="answer">Ничего скачивать не нужно — MIRRO работает прямо в Telegram. Жми ссылку в шапке профиля и пробуй 🤍</p>
    <div class="cta">
      <div class="up">↑</div>
      <p>Ссылка — в шапке профиля</p>
      <div class="bot">@Mirro_wardrobe_bot</div>
    </div>
    <div class="tg"><span class="chip">✓ Без установки</span><span class="chip">✓ Прямо в Telegram</span></div>
  </div>
</body>
</html>
